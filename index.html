<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary / Birthday 💜</title>
    
    <!-- အထူဆုံးနဲ့ အလှဆုံး Noto Sans Myanmar Black ကို သုံးထားပါတယ် -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@900&family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Myanmar', sans-serif;
        }

        body {
            background-color: #ffffff; /* ပထမဆုံး White Screen */
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Intro Screen */
        #intro-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            transition: opacity 0.5s;
        }

        .sticker-container {
            width: 250px;
            margin-bottom: 30px;
            /* Tenor embed container ကို fix လုပ်ရန် */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .sticker-container .tenor-gif-embed {
            pointer-events: none; /* Embed ပေါ်က link တွေကို မနှိပ်မိအောင် တားထားပါသည် */
        }

        .enter-btn {
            background: linear-gradient(45deg, #a18cd1 0%, #fbc2eb 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            z-index: 10;
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        /* Quiz Screen */
        #quiz-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            padding: 30px 20px;
            text-align: center;
        }

        /* ထိပ်ဆုံးက အမှား/အမှန် Feedback စာသား (Text Effect နဲ့) */
        #feedback-container {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .feedback-text {
            font-size: 1.8rem;
            font-weight: 900; /* အထူဆုံး */
            opacity: 0;
        }

        .feedback-emoji {
            font-size: 1.8rem;
            opacity: 0;
        }

        /* အမှား/အမှန် Gradient အရောင်များ */
        .text-error {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px rgba(255, 75, 43, 0.3));
        }

        .text-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px rgba(56, 239, 125, 0.3));
        }

        .show-feedback {
            animation: popBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* မေးခွန်းစာသား */
        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 20px 0;
            color: #4C1D95;
            min-height: 40px; /* စာကြောင်းအရှည်အပုကြောင့် ခုန်မနေအောင် */
        }

        /* အဖြေများကို ၂ ခုစီ ရေပြင်ညီတန်းရန် 2x2 Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        width: 100%;
        margin-top: 10px;
    }

    .option-btn {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        padding: 15px 10px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #333;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.2s;
        word-break: break-word; /* စာရှည်လျှင် အောက်တစ်ကြောင်းဆင်းရန် (စာမပျက်စေရန်) */
        line-height: 1.4;
    }

    .option-btn:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes popBounce {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
    }
    
    /* Main Website Content (Birthday Theme) */
    #main-content {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        text-align: center;
        background: radial-gradient(circle at center, #f3e8ff 0%, #d8b4e2 100%);
        overflow: hidden;
        position: relative;
    }

    .birthday-text {
        font-family: 'Great Vibes', cursive;
        font-size: 4.5rem;
        color: #6B21A8;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(0,0,0,0.2);
        animation: floatAndGlow 3s ease-in-out infinite;
        z-index: 10;
        padding: 0 20px;
        line-height: 1.2;
    }

    @keyframes floatAndGlow {
        0%, 100% { transform: translateY(0); text-shadow: 0 0 15px rgba(255,255,255,0.8); }
        50% { transform: translateY(-15px); text-shadow: 0 0 25px rgba(107, 33, 168, 0.6); }
    }

    /* Heart Transition Overlay */
    #heart-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        background-color: transparent;
        pointer-events: none;
    }
    
    .big-heart {
        color: #9c27b0; /* ခရမ်းရောင် အသည်း */
        font-size: 20px;
        transform: scale(0);
        transition: transform 2.5s cubic-bezier(0.64, 0.04, 0.35, 1);
    }

    @keyframes fall {
        to { transform: translateY(110vh) rotate(360deg); }
    }

    @media (max-width: 600px) {
        .birthday-text { font-size: 3.5rem; }
    }
    
    /* Tenor script အလုပ်လုပ်ချိန်တွင် ပုံများ ထပ်မနေစေရန် */
    .quiz-sticker-wrapper {
            display: none;
            width: 250px;
        }
        
        .quiz-sticker-wrapper.active {
            display: block;
        }
        
        /* Main Website Content ပုံစံကြမ်း (နောက်ဆုံး မှန်သွားလျှင် ပြရန်) */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            text-align: center;
            background-color: #fce4ec;
        }

    </style>
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <div class="sticker-container">
            <!-- Intro Sticker Embed -->
            <div class="tenor-gif-embed" data-postid="12746691280645153574" data-share-method="host" data-aspect-ratio="1" data-width="100%"><a href="https://tenor.com/view/munch-face-gif-12746691280645153574">Munch Face Sticker</a>from <a href="https://tenor.com/search/munch+face-stickers">Munch Face Stickers</a></div>
        </div>
        <button class="enter-btn" onclick="startQuiz()">Tap to here</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen">
        <!-- အမှား/အမှန် စာသားပြမည့် နေရာ -->
        <div id="feedback-container">
            <span id="feedback-text" class="feedback-text"></span>
            <span id="feedback-emoji" class="feedback-emoji"></span>
        </div>

        <!-- အလယ်မှာ Stickers များ (Embeds များကို သီးသန့်ခွဲထားပြီး လိုအပ်မှ ပြပါမည်) -->
        <div class="sticker-container">
            <!-- 1. Thinking Sticker -->
            <div id="sticker-thinking" class="quiz-sticker-wrapper active">
                <div class="tenor-gif-embed" data-postid="20044188" data-share-method="host" data-aspect-ratio="1" data-width="100%"><a href="https://tenor.com/view/am-happy-gif-20044188">Am Happy Sticker</a>from <a href="https://tenor.com/search/am-stickers">Am Stickers</a></div>
            </div>
            
            <!-- 2. Angry/Hitting Sticker -->
            <div id="sticker-angry" class="quiz-sticker-wrapper">
                <div class="tenor-gif-embed" data-postid="1128914395439640917" data-share-method="host" data-aspect-ratio="0.952381" data-width="100%"><a href="https://tenor.com/view/dudu-heating-bubu-angry-dudu-dudu-bubu-new-dudu-couple-fighting-gif-1128914395439640917">Dudu Heating Bubu Angry Dudu Sticker</a>from <a href="https://tenor.com/search/dudu+heating+bubu-stickers">Dudu Heating Bubu Stickers</a></div>
            </div>
            
            <!-- 3. Kissing Sticker -->
            <div id="sticker-kissing" class="quiz-sticker-wrapper">
                <div class="tenor-gif-embed" data-postid="22536058" data-share-method="host" data-aspect-ratio="1" data-width="100%"><a href="https://tenor.com/view/bear-kiss-bear-kisses-kiss-kisses-love-gif-22536058">Bear Kiss Bear Kisses Sticker</a>from <a href="https://tenor.com/search/bear+kiss-stickers">Bear Kiss Stickers</a></div>
            </div>
        </div>

        <!-- အောက်နားလေးမှာ မေးခွန်း -->
        <div id="question-text" class="question-text">မေးခွန်း...</div>

        <!-- ၂ ခုစီ ရေပြင်ညီတန်းမည့် Grid -->
        <div class="options-grid" id="options-grid">
            <!-- ခလုတ်များကို JS မှ ထည့်ပေးမည် -->
        </div>
    </div>
    
    <!-- Main Website Content (Birthday Theme) -->
    <div id="main-content">
        <h1 class="birthday-text">Happy Birthday<br>Linmm 💜</h1>
    </div>

    <!-- Background Music (Ed Sheeran - Perfect) -->
    <!-- မိမိစက်ထဲတွင် perfect.mp3 ဖိုင် ရှိရပါမည် -->
    <audio id="bg-music" loop>
        <source src="perfect.mp3" type="audio/mpeg">
    </audio>

    <!-- Heart Transition Overlay -->
    <div id="heart-overlay">
        <div class="big-heart">💜</div>
    </div>

    <!-- Tenor Embed Script (တစ်ခါတည်း ထည့်ထားရန်) -->
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

    <script>
        const questions = [
            {
                q: "၁။ Dudu မရဲ့အသက်ကဘယ်လောက်လဲ",
                options: ["၂၁", "၂၂", "၂၃", "၂၄"],
                answer: "၂၂",
                wrongMsg: "မှန်မှန်ဖြေလေ",
                wrongEmoji: "😠",
                rightEmoji: "😘"
            },
            {
                q: "၂။ Dudu မရဲ့အကြိုက်ဆုံးအရောင်ကဘာလဲ",
                options: ["ပန်းရောင်", "အပြာရောင်", "ခရမ်းရောင်", "အနက်ရောင်"],
                answer: "ခရမ်းရောင်",
                wrongMsg: "ကိုယ့်ဟာကိုတောင်မသိဘူးလား မDudu",
                wrongEmoji: "😒",
                rightEmoji: "🥰"
            },
            {
                q: "၃။ Dudu & Bubu ရဲ့ Anniversary Date ကဘယ်လောက်လဲ",
                options: ["၁.၅.၂၀၂၅", "၃၀.၄.၂၀၂၅", "၃၁.၅.၂၀၂၅", "၃၀.၅.၂၀၂၅"],
                answer: "၃၀.၄.၂၀၂၅",
                wrongMsg: "ဒါကိုတောင်မသိဘူးပေါ့လေ",
                wrongEmoji: "😤",
                rightEmoji: "💖"
            },
            {
                q: "၄။ Bubu က Dudu ကိုဘယ်လောက်ထိချစ်လဲ",
                options: ["နည်းနည်းလေး", "သာမန်ပဲ", "မိုးလောက်ကြီး", "မချစ်ဘူး"],
                answer: "မိုးလောက်ကြီး",
                wrongMsg: "ဒါကိုတောင်မသိဘူးပေါ့လေ တွေ့မယ်နော်",
                wrongEmoji: "🔪",
                rightEmoji: "👩‍❤️‍💋‍👨"
            }
        ];

        let currentQuestionIndex = 0;
        let isWaitingForNext = false; // ခလုတ်တွေ အထပ်ထပ် မနှိပ်မိစေရန်

        function startQuiz() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            loadQuestion();
        }

        function showSticker(stickerType) {
            // Sticker ၃ ခုလုံးကို အရင်ဖျောက်ပါ
            document.getElementById('sticker-thinking').classList.remove('active');
            document.getElementById('sticker-angry').classList.remove('active');
            document.getElementById('sticker-kissing').classList.remove('active');
            
            // လိုချင်တဲ့ Sticker ကို ပြပါ
            document.getElementById('sticker-' + stickerType).classList.add('active');
        }

        function loadQuestion() {
            isWaitingForNext = false;
            const qData = questions[currentQuestionIndex];
            
            // စဥ်းစားနေတဲ့ Sticker ပြန်ထားရန်
            showSticker('thinking');
            
            // မေးခွန်းစာသား
            document.getElementById('question-text').innerText = qData.q;
            
            // Feedback စာသား ရှင်းထုတ်ရန်
            resetFeedback();

            // Options ခလုတ်များ ထုတ်ရန်
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, qData.answer);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isWaitingForNext) return; // စောင့်နေချိန်တွင် ထပ်နှိပ်၍မရပါ
            
            const qData = questions[currentQuestionIndex];
            const feedbackText = document.getElementById('feedback-text');
            const feedbackEmoji = document.getElementById('feedback-emoji');
            
            resetFeedback(); 

            setTimeout(() => {
                // အဖြေတိုက်စစ်ခြင်း
                if (selected === correct) {
                    
                    // --- အဖြေမှန်လျှင် ---
                    isWaitingForNext = true;
                    showSticker('kissing'); // Kissing sticker ပြမည်
                    
                    // ၄ ခုမြောက် (နောက်ဆုံး) မေးခွန်းဆိုလျှင် စာသားခွဲပြမည်
                    if (currentQuestionIndex === 3) {
                        feedbackText.innerText = "အဲ့ထက်တောင်ပိုသေးတယ်နော်";
                    } else {
                        feedbackText.innerText = "မှန်တာပေါ့ အာဘွား";
                    }
                    
                    feedbackText.className = 'feedback-text text-success show-feedback';
                    feedbackEmoji.innerText = qData.rightEmoji;
                    feedbackEmoji.className = 'feedback-emoji show-feedback';
                    
                    // ၂.၅ စက္ကန့်နေလျှင် နောက်မေးခွန်းသို့ ကူးရန်
                    setTimeout(() => {
                        currentQuestionIndex++;
                        if (currentQuestionIndex < questions.length) {
                            loadQuestion();
                        } else {
                            // ၄ ခုလုံးမှန်သွားလျှင် Transition ဖြင့် Main Page သို့ သွားရန်
                            startTransition();
                        }
                    }, 2500);

                } else {
                    
                    // --- အဖြေမှားလျှင် ---
                    isWaitingForNext = true;
                    showSticker('angry'); // Angry sticker ပြမည်
                    
                    feedbackText.innerText = qData.wrongMsg;
                    feedbackText.className = 'feedback-text text-error show-feedback';
                    
                    feedbackEmoji.innerText = qData.wrongEmoji;
                    feedbackEmoji.className = 'feedback-emoji show-feedback';
                    
                    // Screen တုန်ခါရန်
                    document.body.classList.add('shake');
                    setTimeout(() => {
                        document.body.classList.remove('shake');
                    }, 500);
                    
                    // ခဏနေလျှင် ပြန်စဥ်းစားသော ပုံစံသို့ ပြန်ပြောင်းပြီး ထပ်ဖြေခွင့်ပေးရန်
                    setTimeout(() => {
                        if(currentQuestionIndex < questions.length) {
                             showSticker('thinking');
                             resetFeedback();
                             isWaitingForNext = false;
                        }
                    }, 2500);
                }
            }, 50);
        }

        function resetFeedback() {
        const textEl = document.getElementById('feedback-text');
        const emojiEl = document.getElementById('feedback-emoji');
        textEl.innerText = '';
        textEl.className = 'feedback-text';
        emojiEl.innerText = '';
        emojiEl.className = 'feedback-emoji';
    }

    function startTransition() {
        const overlay = document.getElementById('heart-overlay');
        const heart = overlay.querySelector('.big-heart');
        const bgMusic = document.getElementById('bg-music');
        
        overlay.style.display = 'flex';
        
        // Ed Sheeran - Perfect သီချင်းစဖွင့်ရန် (perfect.mp3 ကို ဖိုဒါထဲ ထည့်ထားရန်)
        bgMusic.play().catch(e => console.log("Audio play prevented:", e));
        
        // ခရမ်းရောင် အသည်းပုံလေး ကြီးလာမည့် Animation စရန်
        setTimeout(() => {
            heart.style.transform = 'scale(200)'; // မျက်နှာပြင်အပြည့် ဖုံးသွားရန်
        }, 50);
        
        // မျက်နှာပြင်အပြည့် ဖုံးသွားချိန်တွင်
        setTimeout(() => {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            // Overlay ကို နောက်ခံ ခရမ်းရောင်ပြောင်းပြီး အသည်းပုံ (text) ကို ဖျောက်မည်
            overlay.style.backgroundColor = '#9c27b0';
            heart.style.display = 'none';
            
            // နှလုံးသားလေးတွေ ကြွေကျလာစေမည်
            createFloatingHearts();
            
            // မျက်နှာပြင်သစ် ပေါ်လာစေရန် Overlay ကို ဖြည်းဖြည်းချင်း ဖျောက်မည်
            setTimeout(() => {
                overlay.style.transition = 'opacity 1.5s ease';
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1500);
            }, 500);
            
        }, 2500); // Heart ကြီးလာမည့် ကြာချိန်စောင့်ရန်
    }

    function createFloatingHearts() {
        const bg = document.getElementById('main-content');
        setInterval(() => {
            const heart = document.createElement("div");
            heart.innerHTML = ["💜", "✨", "🌸", "💖"][Math.floor(Math.random()*4)];
            heart.style.position = 'absolute';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "-10vh";
            heart.style.animation = `fall ${Math.random() * 3 + 3}s linear forwards`;
            heart.style.fontSize = (Math.random() * 1.5 + 0.5) + "rem";
            heart.style.zIndex = "1";
            bg.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 300);
    }
</script>
</body>
</html>
