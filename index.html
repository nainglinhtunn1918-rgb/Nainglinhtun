<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary / Birthday 💜</title>
    
    <!-- အထူဆုံးနဲ့ အလှဆုံး Noto Sans Myanmar Black ကို သုံးထားပါတယ် -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@900&family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Myanmar', sans-serif;
        }

        body {
            background-color: #ffffff; /* ပထမဆုံး White Screen */
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Intro Screen */
        #intro-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            transition: opacity 0.5s;
        }

        .sticker-container {
            width: 250px;
            margin-bottom: 30px;
            /* Tenor embed container ကို fix လုပ်ရန် */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .sticker-container .tenor-gif-embed {
            pointer-events: none; /* Embed ပေါ်က link တွေကို မနှိပ်မိအောင် တားထားပါသည် */
        }

        /* Sticker များကို လိုအပ်မှပြရန် (အသစ်ထည့်ရန်) */
        .quiz-sticker-wrapper {
            display: none;
            width: 100%;
        }
        
        .quiz-sticker-wrapper.active {
            display: block;
        }

        .enter-btn {
            background: linear-gradient(45deg, #a18cd1 0%, #fbc2eb 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            z-index: 10;
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        /* Quiz Screen */
        #quiz-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            padding: 30px 20px;
            text-align: center;
        }

        /* ထိပ်ဆုံးက အမှား/အမှန် Feedback စာသား (Text Effect နဲ့) */
        #feedback-container {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .feedback-text {
            font-size: 1.8rem;
            font-weight: 900; /* အထူဆုံး */
            opacity: 0;
        }

        .feedback-emoji {
            font-size: 1.8rem;
            opacity: 0;
        }

        /* အမှား/အမှန် Gradient အရောင်များ */
        .text-error {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px rgba(255, 75, 43, 0.3));
        }

        .text-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 2px rgba(56, 239, 125, 0.3));
        }

        .show-feedback {
            animation: popBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* မေးခွန်းစာသား */
        .question-text {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 20px 0;
            color: #4C1D95;
            min-height: 40px; /* စာကြောင်းအရှည်အပုကြောင့် ခုန်မနေအောင် */
        }

        /* အဖြေများကို ၂ ခုစီ ရေပြင်ညီတန်းရန် 2x2 Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        width: 100%;
        margin-top: 10px;
    }

    .option-btn {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        padding: 15px 10px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #333;
        border-radius: 15px;
        cursor: pointer;
        transition: all 0.2s;
        word-break: break-word; /* စာရှည်လျှင် အောက်တစ်ကြောင်းဆင်းရန် (စာမပျက်စေရန်) */
        line-height: 1.4;
    }

    .option-btn:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes popBounce {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Birthday Screen */
        #birthday-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            text-align: center;
            background: radial-gradient(circle at center, #f3e8ff 0%, #d8b4e2 100%);
            opacity: 1;
            transition: opacity 1.5s ease; 
            position: absolute;
            top: 0; left: 0;
            z-index: 50;
            overflow: hidden; /* အသည်းပုံလေးတွေ screen ပြင်ပမရောက်စေရန် */
        }

        .birthday-text {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #6B21A8;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(0,0,0,0.2);
            animation: floatAndGlow 3s ease-in-out infinite;
            padding: 0 20px;
            line-height: 1.2;
            z-index: 2;
        }

        @keyframes floatAndGlow {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 15px rgba(255,255,255,0.8); }
            50% { transform: translateY(-15px); text-shadow: 0 0 25px rgba(107, 33, 168, 0.6); }
        }

        /* Birthday မျက်နှာပြင်အတွက် အသည်းပုံကြွေကျသည့် Effect */
        .bday-heart {
            position: absolute;
            top: -10vh;
            font-size: 1.8rem;
            animation: fallBday linear forwards;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes fallBday {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* MP3 Player Screen */
        #mp3-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            /* Romantic ဆန်သော အရောင်စပ် နောက်ခံ (လှိုင်းကဲ့သို့ ရွေ့လျားနေမည်) */
            background: linear-gradient(-45deg, #ff9a9e, #fbc2eb, #a18cd1, #fad0c4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            opacity: 0;
            transition: opacity 1.5s ease;
            position: absolute;
            top: 0; left: 0;
            z-index: 60;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .player-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px 25px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 0 0 2px rgba(255,255,255,0.5);
            text-align: center;
            animation: breathing 6s ease-in-out infinite; /* အသက်ရှူသကဲ့သို့ ဖြည်းဖြည်းချင်း ကြီးလိုက်သေးလိုက်ဖြစ်မည် */
        }

        @keyframes breathing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            background-color: #f3e8ff;
            position: relative;
            border: 4px solid rgba(255, 255, 255, 0.7); /* မှန်ဘောင်လေးကဲ့သို့ */
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease; 
        }

        .track-info h2 { 
            font-size: 1.8rem; 
            color: #4c1d95; 
            margin-bottom: 5px; 
            font-weight: 900;
        }
        
        .track-info p { 
            font-size: 1.1rem; 
            color: #6b21a8; 
            opacity: 0.8; 
            margin-bottom: 25px; 
            font-family: 'Poppins', sans-serif;
        }
        
        /* Progress Bar */
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #6b21a8;
            font-weight: 600;
            margin-bottom: 30px;
            font-family: 'Poppins', sans-serif;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 6px;
            background: rgba(107, 33, 168, 0.15);
            border-radius: 4px;
            margin: 0 15px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a18cd1, #fbc2eb);
            border-radius: 4px;
            transition: width 1s linear;
            position: relative;
        }
        
        /* Progress bar အစွန်က အလုံးလေး (Knob) */
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        /* Player Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            color: #6b21a8;
        }

        .ctrl-btn {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        .play-btn {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(161, 140, 209, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(161, 140, 209, 0.7);
        }

        /* SVG Icons များအတွက် */
        .play-btn svg, .ctrl-btn svg {
            fill: currentColor;
        }

        /* Heart Burst Animation Styles (အသစ်ထည့်ရန်) */
        .ctrl-btn, .play-btn {
            position: relative; /* စာသားကို နေရာချရန် */
        }
        
        .burst-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            font-family: 'Noto Sans Myanmar', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: #ff416c; /* ပန်းရောင်ရင့်ရင့် */
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            z-index: 10;
        }

        .shattered .heart-icon {
            animation: shatterHeart 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .shattered .burst-text {
            animation: floatKiss 1.5s ease-out forwards;
        }

        @keyframes shatterHeart {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.5) rotate(-10deg); filter: brightness(1.2); }
            100% { transform: scale(0) rotate(15deg); opacity: 0; filter: blur(5px); }
        }

        @keyframes floatKiss {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -100%) scale(1.3); }
            70% { opacity: 1; transform: translate(-50%, -130%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -180%) scale(0.8); }
        }

        /* Heart Transition Overlay */
        #heart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background-color: transparent;
            pointer-events: none;
        }
        
        .big-heart {
            color: #9c27b0;
            font-size: 20px;
            transform: scale(0);
            transition: transform 2.5s cubic-bezier(0.64, 0.04, 0.35, 1);
        }

        @media (max-width: 600px) {
            .birthday-text { font-size: 3.5rem; }
        }

    </style>
</head>

            {
                q: "၃။ Dudu & Bubu ရဲ့ Anniversary Date ကဘယ်လောက်လဲ",
                options: ["၁.၅.၂၀၂၅", "၃၀.၄.၂၀၂၅", "၃၁.၅.၂၀၂၅", "၃၀.၅.၂၀၂၅"],
                answer: "၃၀.၄.၂၀၂၅",
                wrongMsg: "ဒါကိုတောင်မသိဘူးပေါ့လေ",
                wrongEmoji: "😤",
                rightEmoji: "💖"
            },
            {
                q: "၄။ Bubu က Dudu ကိုဘယ်လောက်ထိချစ်လဲ",
                options: ["နည်းနည်းလေး", "သာမန်ပဲ", "မိုးလောက်ကြီး", "မချစ်ဘူး"],
                answer: "မိုးလောက်ကြီး",
                wrongMsg: "ဒါကိုတောင်မသိဘူးပေါ့လေ တွေ့မယ်နော်",
                wrongEmoji: "🔪",
                rightEmoji: "👩‍❤️‍💋‍👨"
            }
        ];

        let currentQuestionIndex = 0;
        let isWaitingForNext = false; // ခလုတ်တွေ အထပ်ထပ် မနှိပ်မိစေရန်

        function startQuiz() {
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            loadQuestion();
        }

        function showSticker(stickerType) {
            // Sticker ၃ ခုလုံးကို အရင်ဖျောက်ပါ
            document.getElementById('sticker-thinking').classList.remove('active');
            document.getElementById('sticker-angry').classList.remove('active');
            document.getElementById('sticker-kissing').classList.remove('active');
            
            // လိုချင်တဲ့ Sticker ကို ပြပါ
            document.getElementById('sticker-' + stickerType).classList.add('active');
        }

        function loadQuestion() {
            isWaitingForNext = false;
            const qData = questions[currentQuestionIndex];
            
            // စဥ်းစားနေတဲ့ Sticker ပြန်ထားရန်
            showSticker('thinking');
            
            // မေးခွန်းစာသား
            document.getElementById('question-text').innerText = qData.q;
            
            // Feedback စာသား ရှင်းထုတ်ရန်
            resetFeedback();

            // Options ခလုတ်များ ထုတ်ရန်
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, qData.answer);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (isWaitingForNext) return; // စောင့်နေချိန်တွင် ထပ်နှိပ်၍မရပါ
            
            const qData = questions[currentQuestionIndex];
            const feedbackText = document.getElementById('feedback-text');
            const feedbackEmoji = document.getElementById('feedback-emoji');
            
            resetFeedback(); 

            setTimeout(() => {
                // အဖြေတိုက်စစ်ခြင်း
                if (selected === correct) {
                    
                    // --- အဖြေမှန်လျှင် ---
                    isWaitingForNext = true;
                    showSticker('kissing'); // Kissing sticker ပြမည်
                    
                    // ၄ ခုမြောက် (နောက်ဆုံး) မေးခွန်းဆိုလျှင် စာသားခွဲပြမည်
                    if (currentQuestionIndex === 3) {
                        feedbackText.innerText = "အဲ့ထက်တောင်ပိုသေးတယ်နော်";
                    } else {
                        feedbackText.innerText = "မှန်တာပေါ့ အာဘွား";
                    }
                    
                    feedbackText.className = 'feedback-text text-success show-feedback';
                    feedbackEmoji.innerText = qData.rightEmoji;
                    feedbackEmoji.className = 'feedback-emoji show-feedback';
                    
                    // ၂.၅ စက္ကန့်နေလျှင် နောက်မေးခွန်းသို့ ကူးရန်
                    setTimeout(() => {
                        currentQuestionIndex++;
                        if (currentQuestionIndex < questions.length) {
                            loadQuestion();
                        } else {
                            // ၄ ခုလုံးမှန်သွားလျှင် Transition ဖြင့် Main Page သို့ သွားရန်
                            startTransition();
                        }
                    }, 2500);

                } else {
                    
                    // --- အဖြေမှားလျှင် ---
                    isWaitingForNext = true;
                    showSticker('angry'); // Angry sticker ပြမည်
                    
                    feedbackText.innerText = qData.wrongMsg;
                    feedbackText.className = 'feedback-text text-error show-feedback';
                    
                    feedbackEmoji.innerText = qData.wrongEmoji;
                    feedbackEmoji.className = 'feedback-emoji show-feedback';
                    
                    // Screen တုန်ခါရန်
                    document.body.classList.add('shake');
                    setTimeout(() => {
                        document.body.classList.remove('shake');
                    }, 500);
                    
                    // ခဏနေလျှင် ပြန်စဥ်းစားသော ပုံစံသို့ ပြန်ပြောင်းပြီး ထပ်ဖြေခွင့်ပေးရန်
                    setTimeout(() => {
                        if(currentQuestionIndex < questions.length) {
                             showSticker('thinking');
                             resetFeedback();
                             isWaitingForNext = false;
                        }
                    }, 2500);
                }
            }, 50);
        }

        function resetFeedback() {
            const textEl = document.getElementById('feedback-text');
            const emojiEl = document.getElementById('feedback-emoji');
            textEl.innerText = '';
            textEl.className = 'feedback-text';
            emojiEl.innerText = '';
            emojiEl.className = 'feedback-emoji';
        }

        function startTransition() {
            const overlay = document.getElementById('heart-overlay');
            const heart = overlay.querySelector('.big-heart');
            
            overlay.style.display = 'flex';
            
            // ခရမ်းရောင် အသည်းပုံလေး ကြီးလာမည့် Animation စရန်
            setTimeout(() => {
                heart.style.transform = 'scale(200)'; // မျက်နှာပြင်အပြည့် ဖုံးသွားရန်
            }, 50);
            
            // မျက်နှာပြင်အပြည့် ဖုံးသွားချိန် (2.5s အကြာ) တွင်
            setTimeout(() => {
                document.getElementById('quiz-screen').style.display = 'none';
                
                // Birthday Screen (စာသား) ကို ပြမည်
                const birthdayScreen = document.getElementById('birthday-screen');
                birthdayScreen.style.display = 'flex';
                
                // --- အသည်းပုံလေးတွေ၊ ပန်းပွင့်လေးတွေ ကြွေကျမည့် Animation စရန် ---
                let bdayHeartTimer = setInterval(() => {
                    const bdayHeart = document.createElement("div");
                    bdayHeart.innerHTML = ["💜", "💖", "✨", "🌸"][Math.floor(Math.random() * 4)];
                    bdayHeart.className = "bday-heart";
                    // ကျပန်း နေရာနဲ့ အရှိန်
                    bdayHeart.style.left = Math.random() * 100 + "vw";
                    bdayHeart.style.animationDuration = (Math.random() * 2 + 3) + "s"; // 3s to 5s 
                    birthdayScreen.appendChild(bdayHeart);
                    
                    setTimeout(() => {
                        bdayHeart.remove();
                    }, 5000);
                }, 300); // 0.3 စက္ကန့် တစ်ခါ အသစ်ကြွေမည်

                // Overlay အသည်းပုံကို ဖြည်းဖြည်းချင်း ဖျောက်မည်
                overlay.style.transition = 'opacity 1.5s ease';
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 1500);

                // ၃ စက္ကန့် ကြာပြီးနောက် Happy Birthday စာသားကို ဖြည်းဖြည်းချင်း မှိန်သွားစေမည်
                setTimeout(() => {
                    birthdayScreen.style.opacity = '0';
                    
                    // မှိန်သွားပြီးနောက် (1.5s အကြာ) MP3 Player သို့ ကူးမည်
                    setTimeout(() => {
                        clearInterval(bdayHeartTimer); // အသည်းပုံကြွေတာ ရပ်မည်
                        birthdayScreen.style.display = 'none';
                        startMP3Player();
                    }, 1500);
                }, 3000);
                
            }, 2500); // Heart ကြီးလာမည့် ကြာချိန်စောင့်ရန်
        }

        function startMP3Player() {
            const mp3Screen = document.getElementById('mp3-screen');
            mp3Screen.style.display = 'flex';
            
            // Player UI လေး ဖြည်းဖြည်းချင်း လင်းလာရန်
            setTimeout(() => {
                mp3Screen.style.opacity = '1';
            }, 50);

            // ယခုမှ သီချင်းစဖွင့်မည်
            const bgMusic = document.getElementById('bg-music');
            bgMusic.play().catch(e => console.log("Audio play prevented:", e));

            // ပုံ ၂၀ စာရင်း (မိမိထည့်ချင်သော ပုံ ၂၀ ရဲ့ နာမည်များ/Link များကို ဤနေရာတွင် အစားထိုးပါ)
            // ဥပမာ - "photo1.jpg", "photo2.jpg" စသည်ဖြင့် ပြင်ပါ
            const images = [];
            for(let i=1; i<=20; i++) {
                images.push(`https://placehold.co/600x600/f3e8ff/6B21A8?text=Your+Photo+${i}`);
            }
            
            const sliderImg = document.getElementById('slider-img');
            const progressFill = document.getElementById('progress-fill');
            const currentTimeEl = document.getElementById('current-time');
            
            let imgIndex = 0;
            let elapsedSeconds = 0;
            const totalDuration = 60; // 1 မိနစ်
            
            // ပထမဆုံးပုံ တန်းပေါ်ရန်
            sliderImg.src = images[imgIndex];
            
            // 1 စက္ကန့်တိုင်း Progress bar ရွေ့ရန်နှင့် အချိန်ပြရန် (Timers)
            const progressTimer = setInterval(() => {
                elapsedSeconds++;
                
                if (elapsedSeconds <= totalDuration) {
                    // Progress Bar အရှည်တွက်ချက်ခြင်း
                    const percent = (elapsedSeconds / totalDuration) * 100;
                    progressFill.style.width = `${percent}%`;
                    
                    // စက္ကန့်ကို mm:ss ပုံစံပြောင်းခြင်း
                    const mins = Math.floor(elapsedSeconds / 60);
                    const secs = elapsedSeconds % 60;
                    currentTimeEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                } else {
                    clearInterval(progressTimer); // 60 စက္ကန့်ပြည့်လျှင် ရပ်မည်
                }
            }, 1000);

            // ၃ စက္ကန့်တစ်ခါ ပုံပြောင်းမည့် Slideshow Effect
            const imageTimer = setInterval(() => {
                imgIndex++;
                if (imgIndex < images.length) {
                    // ပုံဟောင်း မှိန်သွားမည်
                    sliderImg.style.opacity = '0';
                    
                    // စက္ကန့်ဝက် (0.5s) နေလျှင် ပုံအသစ်ပြောင်းပြီး ပြန်လင်းလာမည်
                    setTimeout(() => {
                        sliderImg.src = images[imgIndex];
                        sliderImg.style.opacity = '1';
                    }, 500);
                } else {
                    clearInterval(imageTimer); // ပုံ ၂၀ ပြည့်လျှင် ရပ်မည်
                }
            }, 3000);
        }

        // အသည်းပုံ ကွဲထွက်ပြီး အာဘွားစာသား ပေါ်လာမည့် Function
        function popKiss(btn) {
            // လောလောဆယ် animation လုပ်နေလျှင် ထပ်မလုပ်ရန် (ခလုတ်ကို အထပ်ထပ်မနှိပ်မိစေရန်)
            if (btn.classList.contains('shattered')) return;
            
            btn.classList.add('shattered');
            
            // 1.5 စက္ကန့်အကြာ (Animation ပြီးသွားချိန်) တွင် မူလအခြေအနေသို့ ပြန်ထားရန်
            setTimeout(() => {
                btn.classList.remove('shattered');
            }, 1500);
        }
    </script>

    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
